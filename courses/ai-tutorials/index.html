<script src="claude/course.js"></script>
<script>
(function(){
  var D = window.CLAUDE_COURSE, LANG='zh';
  try{ var q=new URLSearchParams(location.search).get('lang'); var sv=localStorage.getItem('rea-lang');
    LANG=(q==='en'||q==='zh')?q:(sv==='en'||sv==='zh')?sv:((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en'); }catch(e){}
  function render(){
    document.documentElement.lang = LANG==='zh'?'zh-Hant':'en';
    document.querySelectorAll('[data-zh]').forEach(function(el){ el.textContent = el.dataset[LANG]; });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===LANG); });
    document.title = LANG==='zh'?'AI 使用教學':'AI Tutorials';
    if(!D) return;
    document.getElementById('c-count').textContent = D.live+' / '+D.total;
    document.getElementById('c-bar').style.width = (D.live/D.total*100)+'%';
    var eps=[]; D.catalog.series.forEach(function(s){ (s.episodes||[]).forEach(function(e){ eps.push(e); }); if(s.overview) eps.push(s.overview); });
    eps.sort(function(a,b){ return b.id < a.id ? -1 : 1; });
    var ul=document.getElementById('c-latest'); ul.innerHTML='';
    eps.slice(0,3).forEach(function(e){ var li=document.createElement('li'); li.innerHTML='<span class="n">'+e.id.slice(0,3)+'</span>'; var a=document.createElement('a'); a.href='claude/'+e.path+(LANG==='en'?'?lang=en':''); a.textContent=e.title[LANG]||e.title.zh; li.appendChild(a); ul.appendChild(li); });
  }
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.onclick=function(){ LANG=b.dataset.lang; try{localStorage.setItem('rea-lang',LANG);}catch(e){} render(); }; });
  render();
})();
</script>
</body>
</html>
