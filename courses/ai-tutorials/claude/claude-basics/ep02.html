<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>02 好提示詞的五個要素｜入門基礎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e7eeec;
  --surface:#f6f9f8;
  --ink:#13232e;
  --muted:#4f6470;
  --line:#c5d3d2;
  --chart:#0e2a3b;
  --signal:#f2c230;
  --alert:#e8572a;
  --sea:#1f7f99;
  --stepdone:#1f7f99;
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Noto Sans TC","PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08202d;--surface:#0e2a3b;--ink:#e3ecee;--muted:#93aab4;--line:#1f4254;--stepdone:#58b8d0;--sea:#58b8d0;
  }
}
:root[data-theme="dark"]{--bg:#08202d;--surface:#0e2a3b;--ink:#e3ecee;--muted:#93aab4;--line:#1f4254;--stepdone:#58b8d0;--sea:#58b8d0;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:18px clamp(12px,3vw,32px) 48px}

/* ---------- title ---------- */
.masthead{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;margin:6px 0 16px}
.masthead .mark{grid-row:span 2;width:58px;height:58px;border-radius:14px;background:var(--chart);display:grid;place-items:center}
.masthead .mark svg{width:40px;height:40px}
.masthead h1{margin:0;font-size:clamp(24px,3.4vw,38px);font-weight:900;letter-spacing:.02em;line-height:1.15}
.masthead p{margin:0;color:var(--muted);font-size:clamp(13px,1.5vw,15px);max-width:62ch}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--chart);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(8,32,45,.55)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;display:grid;place-items:center;background:#051620}
.stage:fullscreen canvas{position:relative;inset:auto;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16))}
.chapcard{position:absolute;left:clamp(10px,2vw,22px);top:clamp(10px,2vw,20px);display:flex;align-items:stretch;gap:12px;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s}
.chapcard.show{opacity:1;transform:none}
.chapcard .no{font-family:var(--cond);font-weight:700;font-size:clamp(30px,4.6vw,58px);line-height:.9;color:var(--signal);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.chapcard .tt{display:flex;flex-direction:column;justify-content:center;padding-left:12px;border-left:3px solid var(--signal)}
.chapcard b{font-size:clamp(15px,2.1vw,26px);font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);line-height:1.2}
.chapcard i{font-style:normal;font-family:var(--cond);font-weight:500;font-size:clamp(12px,1.35vw,17px);color:rgba(255,255,255,.82);letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.caption{position:absolute;left:50%;bottom:clamp(8px,1.8vw,20px);transform:translateX(-50%);max-width:min(88%,760px);background:rgba(7,26,37,.78);color:#f2f6f7;border-radius:10px;padding:7px 16px;font-size:clamp(12px,1.5vw,17px);font-weight:500;text-align:center;pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .35s}
.caption:empty{opacity:0}
.caption .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal);margin-right:8px;vertical-align:middle;transform:translateY(-1px)}
.scale-note{position:absolute;right:12px;top:10px;font-size:11px;color:rgba(255,255,255,.62);pointer-events:none}

/* ---------- controls ---------- */
.controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);height:40px;min-width:40px;border-radius:10px;display:inline-grid;place-items:center;cursor:pointer;font:inherit;font-size:14px;padding:0 10px}
.btn:hover{border-color:var(--sea)}
.btn:focus-visible,.seg button:focus-visible,.chap:focus-visible,.timeline:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn svg{width:18px;height:18px}
.btn.play{background:var(--chart);color:#fff;border-color:var(--chart);min-width:48px}
.timeline{position:relative;flex:1 1 320px;height:40px;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:8px}
.tl-track{position:relative;display:flex;width:100%;height:12px;border-radius:3px;overflow:hidden;background:var(--line)}
.tl-seg{height:100%;border-right:2px solid var(--bg);position:relative}
.tl-seg:nth-child(odd){background:rgba(19,35,46,.10)}
.tl-seg:last-child{border-right:0}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:var(--chart);pointer-events:none}
:root[data-theme="dark"] .tl-fill{background:var(--sea)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-fill{background:var(--sea)}}
.tl-head{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--signal);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.time{font-family:var(--cond);font-weight:600;font-size:16px;color:var(--muted);min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--cond);font-weight:600;font-size:15px;padding:0 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chart);color:#fff}
.btn.toggle[aria-pressed="false"]{color:var(--muted)}

/* ---------- info ---------- */
.info{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.info h2{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:900;line-height:1.25;display:flex;align-items:baseline;gap:12px}
.info h2 .n{font-family:var(--cond);font-weight:700;color:var(--sea);font-size:1.15em}
.info .en{margin:2px 0 12px;font-family:var(--cond);font-size:18px;font-weight:500;color:var(--muted)}
.info .desc{margin:0;font-size:16px;line-height:1.85;max-width:44em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:0;list-style:none}
.chips li{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.steps{list-style:none;margin:0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;counter-reset:s}
.steps h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.steps li{position:relative;padding:8px 0 8px 34px;font-size:15px;color:var(--muted);border-top:1px dashed var(--line);counter-increment:s;transition:color .3s}
.steps li:first-of-type{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:13px;color:var(--muted);background:var(--surface)}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"✓";background:var(--stepdone);border-color:var(--stepdone);color:#fff}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{background:var(--signal);border-color:var(--signal);color:#13232e}

/* ---------- chapter index ---------- */
.chapters{margin-top:28px}
.chapters h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chap{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;display:flex;gap:10px;align-items:center;min-height:48px}
.chap .n{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--muted);min-width:24px}
.chap .t{font-size:14px;line-height:1.3}
.chap:hover{border-color:var(--sea)}
.chap.active{background:var(--chart);border-color:var(--chart);color:#fff}
.chap.active .n{color:var(--signal)}
.chap.past .n{color:var(--sea)}
.foot{margin-top:28px;font-size:13px;color:var(--muted);max-width:80ch;line-height:1.7}

@media (max-width:820px){
  .info{grid-template-columns:1fr;gap:18px}
  .masthead .mark{width:46px;height:46px;border-radius:12px}
  .masthead .mark svg{width:32px;height:32px}
  .scale-note{display:none}
  .stage{border-radius:12px}
}
@media (max-width:560px){
  .chapcard{gap:8px}
  .chapcard .tt{padding-left:8px;border-left-width:2px}
  .caption{padding:5px 10px;border-radius:8px}
  .time{min-width:0;font-size:14px}
  .seg button{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){
  .chapcard,.caption{transition:none}
}
/* ---------- i18n ---------- */
:root[lang="ja"]{--sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic","Meiryo","Noto Sans TC",system-ui,sans-serif;--cond:"Barlow Condensed","Arial Narrow","Noto Sans JP","Noto Sans TC",sans-serif}
.masthead{grid-template-columns:auto 1fr auto}
.langsw{grid-column:3;grid-row:1 / span 2;align-self:start;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:36px;background:var(--surface)}
.langsw button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;padding:0 12px;cursor:pointer;white-space:nowrap}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button[aria-pressed="true"]{background:var(--chart);color:#fff}
.langsw button:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
:root[data-theme="dark"] .seg button[aria-pressed="true"],:root[data-theme="dark"] .langsw button[aria-pressed="true"]{background:var(--sea);color:#08202d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"],:root:not([data-theme="light"]) .langsw button[aria-pressed="true"]{background:var(--sea);color:#08202d}}

/* ---------- video export ---------- */
.btn.rec{display:inline-flex;align-items:center;gap:8px;padding:0 13px}
.btn.rec .rdot{width:10px;height:10px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 3px rgba(232,87,42,.2)}
.recdlg{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:20px clamp(16px,3vw,26px);width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 60px -30px rgba(5,22,32,.65)}
.recdlg::backdrop{background:rgba(5,22,32,.55)}
.rec-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rec-head h2{margin:0;font-size:20px;font-weight:900;line-height:1.3}
.rec-head .btn{height:36px;min-width:36px}
.rec-intro{margin:8px 0 18px;color:var(--muted);font-size:14px;line-height:1.75}
.rec-opts{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}
.rec-opts>span{font-size:14px;font-weight:700;color:var(--muted)}
.rec-opts .seg{justify-self:start;height:36px}
.rec-opts .seg button{min-width:54px}
.seg button.tx{font-family:var(--sans);font-size:13px;font-weight:500;padding:0 12px}
.recdlg.busy .rec-opts{opacity:.5;pointer-events:none}
.rec-sum{margin:16px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec-prog{margin-top:14px}
.rec-prog canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:10px;background:var(--chart)}
.rec-bar{margin-top:10px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.rec-bar i{display:block;height:100%;width:0;background:var(--signal)}
.rec-stat{margin:8px 0 0;font-size:14px;min-height:1.6em}
.rec-stat.err{color:var(--alert);font-weight:500}
.rec-note{margin:2px 0 0;font-size:12px;color:var(--muted)}
.rec-act{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.primary{background:var(--chart);color:#fff;border-color:var(--chart);padding:0 18px;font-weight:700}
.btn.primary:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
[hidden]{display:none!important}
@media (max-width:560px){
  .masthead{grid-template-columns:auto 1fr}
  .langsw{grid-column:1 / -1;grid-row:auto;justify-self:start;margin-top:4px}
  .rec-opts{grid-template-columns:1fr;gap:4px}
  .rec-opts .seg{margin-bottom:8px}
}
.masthead .series{grid-column:2;margin:0;font-size:13px;color:var(--muted);font-weight:500}
.masthead .series a{color:inherit}
.shots{margin-top:28px}
.shots h3,.facts h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.facts{margin-top:28px}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact dt{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1;color:var(--ink)}
.fact dt small{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--sea);margin-left:4px}
.fact dd{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.55}
.chapcard .no small{font-size:.45em;color:rgba(255,255,255,.75);margin-left:4px;font-weight:600}

.masthead .backlink{grid-column:2;font-size:13px;color:var(--sea);text-decoration:none;font-weight:500}
.masthead .backlink:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M20 17 L21.4 37 H18.6 Z" fill="#e3ecee"/><rect x="17.2" y="33" width="5.6" height="4" fill="#f2c230"/><g fill="#e3ecee"><path d="M20 15.5 L20.9 2 L19.4 2.2 Z"/><path d="M20 15.5 L31.8 22.3 L32.3 20.9 Z" /><path d="M20 15.5 L8.2 22.3 L8.9 23.6 Z"/></g><circle cx="20" cy="15.8" r="2.2" fill="#f2c230"/></svg>
    </div>
    <h1><span id="mNo"></span> <span id="mT"></span></h1>
    <p id="mLede"></p>
    <div class="langsw" role="group" data-i18n-aria="langGroup" aria-label="介面語言"><button type="button" data-lang="zh" lang="zh-Hant" aria-pressed="true">中文</button><button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button></div>
    <p class="series" id="mSeries"></p>
    <a class="backlink" href="../" data-i18n="back">← 課程目錄</a>
  </header>
  <section aria-label="動畫" data-i18n-aria="secAnim">
    <div class="stage" id="stage">
      <canvas id="cv" role="img" aria-label="02 好提示詞的五個要素｜入門基礎"></canvas>
      <div class="chapcard" id="chapcard"><span class="no" id="ccNo">01</span><div class="tt"><b id="ccT"></b><i id="ccE"></i></div></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="scale-note" data-i18n="scaleNote">示意圖：比例經過調整</div>
    </div>
    <div class="controls">
      <button class="btn" id="bPrev" data-i18n-aria="prev" aria-label="上一個分鏡"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn play" id="bPlay" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="btn" id="bNext" data-i18n-aria="next" aria-label="下一個分鏡"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <div class="timeline" id="timeline" tabindex="0" role="slider" data-i18n-aria="progress" aria-label="播放進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="tl-track" id="tlTrack"><div class="tl-fill" id="tlFill"></div></div>
        <div class="tl-head" id="tlHead"></div>
      </div>
      <span class="time" id="time">0:00 / 0:00</span>
      <div class="seg" role="group" data-i18n-aria="speed" aria-label="播放速度">
        <button data-speed="0.5" aria-pressed="false">0.5×</button>
        <button data-speed="1" aria-pressed="true">1×</button>
        <button data-speed="2" aria-pressed="false">2×</button>
      </div>
      <button class="btn toggle" id="bLabels" aria-pressed="true" data-i18n-title="labelsTip" data-i18n="labels" title="顯示／隱藏標註">標註</button>
      <button class="btn" id="bFull" data-i18n-aria="full" aria-label="全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn rec" id="bRec" type="button" aria-haspopup="dialog"><span class="rdot" aria-hidden="true"></span><span data-i18n="rec">匯出影片</span></button>
    </div>
  </section>
  <section class="info" aria-live="polite">
    <div>
      <h2><span class="n" id="iNo">1</span><span id="iT"></span></h2>
      <p class="en" id="iE"></p>
      <p class="desc" id="iD"></p>
    </div>
    <ol class="steps" id="iS"></ol>
  </section>
  <nav class="shots" data-i18n-aria="chapNav" aria-label="分鏡">
    <h3 data-i18n="chapHead">本集分鏡</h3>
    <div class="shot-grid" id="shotGrid"></div>
  </nav>
  <section class="facts" data-i18n-aria="factsAria" aria-label="重點數字">
    <h3 data-i18n="factsHead">本集重點數字</h3>
    <dl class="fact-grid" id="facts"></dl>
  </section>
  <p class="foot" id="foot"></p>
</div>
<dialog class="recdlg" id="recDlg" aria-labelledby="recTitle">
  <div class="rec-head">
    <h2 id="recTitle" data-i18n="recTitle">錄製 MP4 影片</h2>
    <button class="btn" id="recX" type="button" data-i18n-aria="close" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p class="rec-intro" data-i18n="recIntro"></p>
  <div class="rec-opts">
    <span id="oSpeed" data-i18n="optSpeed">影片速度</span>
    <div class="seg" role="group" aria-labelledby="oSpeed" data-opt="speed"><button type="button" data-v="1" aria-pressed="true">1×</button><button type="button" data-v="2" aria-pressed="false">2×</button></div>
    <span id="oRange" data-i18n="optRange">範圍</span>
    <div class="seg" role="group" aria-labelledby="oRange" data-opt="range"><button type="button" class="tx" data-v="all" aria-pressed="true" data-i18n="rangeAll">全片</button><button type="button" class="tx" data-v="chap" aria-pressed="false" data-i18n="rangeChap">目前分鏡</button></div>
    <span id="oRes" data-i18n="optRes">解析度</span>
    <div class="seg" role="group" aria-labelledby="oRes" data-opt="res"><button type="button" data-v="720" aria-pressed="false">720p</button><button type="button" data-v="1080" aria-pressed="true">1080p</button></div>
    <span id="oFps" data-i18n="optFps">影格率</span>
    <div class="seg" role="group" aria-labelledby="oFps" data-opt="fps"><button type="button" data-v="30" aria-pressed="true">30 fps</button><button type="button" data-v="60" aria-pressed="false">60 fps</button></div>
  </div>
  <p class="rec-sum" id="recSum"></p>
  <div class="rec-prog" id="recProg" hidden>
    <canvas id="recPrev" width="640" height="360" aria-hidden="true"></canvas>

  text:    '#e3ecee',   // 主要文字
  sub:     '#7a9bb0',   // 次要文字
  cursor:  '#f2c230',   // 閃爍游標
  toolBg:  '#0f2438',   // 工具面板底色
  nodeBg:  '#1a3048',   // 代理節點底色
  nodeAct: '#f2c230',   // 代理節點啟動色
};

/* ═══════════════════════════════════════════════════════════════
   1. 對話視窗：claudeWin(x, y, w, h, opts)
      opts.msgs = [{role:'user'|'ai', text:'...'}, ...]
      opts.u    = 進度 0–1（控制訊息出現）
      opts.typing = true 顯示打字游標
   ═══════════════════════════════════════════════════════════════ */
function claudeWin(x, y, w, h, opts={}){
  const {msgs=[], u=1, typing=false, title='Claude'} = opts;
  ctx.save();
  // 視窗外框
  rrp(x, y, w, h, 10); ctx.fillStyle=KC.winBg; ctx.fill();
  rrp(x, y, w, h, 10); ctx.strokeStyle=KC.border; ctx.lineWidth=1.5; ctx.stroke();
  // 標題列
  rrp(x, y, w, 40, 10);
  const gBar=ctx.createLinearGradient(x,y,x,y+40);
  gBar.addColorStop(0,KC.winBar); gBar.addColorStop(1,KC.winBg);
  ctx.fillStyle=gBar; ctx.fill();
  // 標題列分隔線
  ln([x,y+40,x+w,y+40], KC.border, 1);
  // 模型名稱
  ctx.font=`600 16px 'Noto Sans TC',sans-serif`;
  ctx.fillStyle=KC.text; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(tr(title), x+w/2, y+20);
  // 訊號燈
  [KC.orange, KC.accent, KC.green].forEach((c,i)=>{
    circ(x+16+i*18, y+20, 5, c, 'none', 0);
  });
  // 訊息區域：clip
  ctx.save();
  ctx.beginPath(); ctx.rect(x+2, y+41, w-4, h-42); ctx.clip();
  const pad=16, bh=56, gap=12;
  const shown=Math.ceil(msgs.length * clamp(u*1.2,0,1));
  msgs.slice(0,shown).forEach((m,i)=>{
    const isUser=m.role==='user';
    const by=y+56+i*(bh+gap);
    const bx=isUser? x+w-pad-260: x+pad;
    const bw=Math.min(260, w*0.6);
    // 泡泡
    rrp(bx,by,bw,bh-4,8);
    ctx.fillStyle=isUser? KC.userBub: KC.aiBub; ctx.fill();
    // 角色標籤
    ctx.font=`600 11px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=isUser? '#7dc8dc': KC.accent;
    ctx.textAlign=isUser? 'right': 'left';
    ctx.textBaseline='top';
    ctx.fillText(tr(isUser? '你': 'Claude'), bx+(isUser?bw-8:8), by+7);
    // 訊息文字（截斷顯示）
    ctx.font=`14px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=KC.text; ctx.textBaseline='top';
    const txt=tr(m.text); const maxC=Math.floor((bw-16)/8);
    ctx.fillText(txt.length>maxC? txt.slice(0,maxC)+'…': txt, bx+(isUser?8:8), by+24);
  });
  ctx.restore();
  // 打字游標
  if(typing && u<1){
    const ty=y+56+shown*(bh+gap)+12;
    claudeTypingDot(x+pad+24, ty);
  }
  ctx.restore();
}

/* 打字指示器（三個跳動圓點） */
function claudeTypingDot(x, y){
  [0,1,2].forEach(i=>{
    const dy=-4*Math.sin(TT*4+i*1.2);
    circ(x+i*14, y+dy, 4, KC.sub, 'none', 0);
  });
}

/* ═══════════════════════════════════════════════════════════════
   2. 單一訊息泡泡：bubble(x, y, w, text, role, opts)
      role='user'|'ai'  opts.u=0–1（淡入）
   ═══════════════════════════════════════════════════════════════ */
function bubble(x, y, w, text, role='ai', opts={}){
  const {u=1, lines=1} = opts;
  const h=28+lines*22;
  alphaDo(ease(clamp(u,0,1)), ()=>{
    rrp(x,y,w,h,8);
    ctx.fillStyle=role==='user'? KC.userBub: KC.aiBub; ctx.fill();
    ctx.strokeStyle=KC.border; ctx.lineWidth=1; ctx.stroke();
    ctx.font=`14px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=KC.text; ctx.textAlign='left'; ctx.textBaseline='middle';
    const t=tr(text);
    ctx.fillText(t.length>Math.floor(w/9)? t.slice(0,Math.floor(w/9))+'…': t, x+12, y+h/2);
  });
}

/* ═══════════════════════════════════════════════════════════════
   3. 閃爍游標（模擬 Claude 打字中）
      typeCursor(x, y, u) — u 控制閃爍相位
   ═══════════════════════════════════════════════════════════════ */
function typeCursor(x, y, scale=1){
  const a=0.5+0.5*Math.sin(TT*4);
  alphaDo(a, ()=>{
    box(x, y-16*scale, 2.5*scale, 20*scale, KC.cursor, 'none', 0);
  });
}

/* ═══════════════════════════════════════════════════════════════
   4. 檔案卡：fileCard(x, y, w, label, ext, opts)
      ext='PDF'|'CSV'|'DOCX'|'PNG'|'JS'…
      opts.u=淡入進度  opts.preview='...' 預覽小字
   ═══════════════════════════════════════════════════════════════ */
function fileCard(x, y, w, label, ext='FILE', opts={}){
  const {u=1, preview=''} = opts;
  const h=72, iw=48;
  alphaDo(ease(clamp(u,0,1)), ()=>{
    // 卡片底
    rrp(x,y,w,h,6); ctx.fillStyle='rgba(30,58,85,.9)'; ctx.fill();
    ctx.strokeStyle=KC.border; ctx.lineWidth=1.2; ctx.stroke();
    // 檔案圖示（摺角矩形）
    const ix=x+10, iy=y+10;
    ctx.fillStyle=_extColor(ext);
    ctx.beginPath();
    ctx.moveTo(ix,iy); ctx.lineTo(ix+iw-12,iy); ctx.lineTo(ix+iw,iy+12);
    ctx.lineTo(ix+iw,iy+38); ctx.lineTo(ix,iy+38); ctx.closePath();
    ctx.fill();
    // 摺角
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.moveTo(ix+iw-12,iy); ctx.lineTo(ix+iw-12,iy+12); ctx.lineTo(ix+iw,iy+12); ctx.closePath(); ctx.fill();
    // 副檔名文字
    ctx.font=`700 11px 'Barlow Condensed',sans-serif`;
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ext, ix+iw/2, iy+27);
    // 檔名
    ctx.font=`600 14px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=KC.text; ctx.textAlign='left'; ctx.textBaseline='top';
    const lbl=tr(label);
    ctx.fillText(lbl.length>18? lbl.slice(0,17)+'…': lbl, x+iw+18, y+14);
    if(preview){
      ctx.font=`12px 'Noto Sans TC',sans-serif`;
      ctx.fillStyle=KC.sub;
      ctx.fillText(tr(preview).slice(0,22), x+iw+18, y+36);
    }
  });
}
function _extColor(ext){
  const m={'PDF':'#e8572a','CSV':'#7dffc4','DOCX':'#2a5c8c','PNG':'#b37cff',
           'JS':'#f2c230','PY':'#58b8d0','MD':'#7dc8dc','TXT':KC.sub};
  return m[ext]||KC.sub;
}

/* ═══════════════════════════════════════════════════════════════
   5. 終端機視窗：terminal(x, y, w, h, opts)
      opts.lines=[ 命令字串... ]  opts.u=進度
      opts.prompt='$ '
   ═══════════════════════════════════════════════════════════════ */
function terminal(x, y, w, h, opts={}){
  const {lines=[], u=1, prompt='$ ', title='Terminal'} = opts;
  ctx.save();
  // 外框
  rrp(x,y,w,h,8); ctx.fillStyle='#0a1520'; ctx.fill();
  ctx.strokeStyle=KC.border; ctx.lineWidth=1.5; ctx.stroke();
  // 標題列
  box(x+1,y+1,w-2,30,'#1a2d42','none',0);
  circ(x+14,y+15,5,'#e8572a','none',0);
  circ(x+30,y+15,5,KC.accent,'none',0);
  circ(x+46,y+15,5,KC.green,'none',0);
  ctx.font=`13px 'Barlow Condensed',monospace`;
  ctx.fillStyle=KC.sub; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(title, x+w/2, y+15);
  ln([x,y+30,x+w,y+30],KC.border,1);
  // 文字內容
  ctx.save(); ctx.beginPath(); ctx.rect(x+2,y+31,w-4,h-32); ctx.clip();
  const shown=Math.floor(lines.length*clamp(u*1.5,0,1));
  ctx.font=`14px 'Barlow Condensed',monospace`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  lines.slice(0,shown).forEach((ln_,i)=>{
    const ty=y+38+i*20;
    const isCmd=ln_.startsWith(prompt)||ln_.startsWith('#');
    ctx.fillStyle=isCmd? KC.green: KC.text;
    ctx.fillText(tr(ln_), x+12, ty);
  });
  // 游標（最後一行末）
  if(shown<lines.length||u<0.9){
    const cy=y+38+shown*20;
    typeCursor(x+12+8*(prompt.length), cy);
  }
  ctx.restore();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   6. 瀏覽器視窗：browserWin(x, y, w, h, opts)
      opts.url='claude.ai/...'  opts.u=0–1（頁面淡入）
      opts.drawContent=fn(innerX,innerY,innerW,innerH)
   ═══════════════════════════════════════════════════════════════ */
function browserWin(x, y, w, h, opts={}){
  const {url='claude.ai', u=1, drawContent=null} = opts;
  ctx.save();
  // 外框
  rrp(x,y,w,h,8); ctx.fillStyle='#12202f'; ctx.fill();
  ctx.strokeStyle=KC.border; ctx.lineWidth=1.5; ctx.stroke();
  // 工具列
  box(x+1,y+1,w-2,38,'#1d3040','none',0);
  // 返回 / 前進
  ctx.font=`16px 'Barlow Condensed',sans-serif`;
  ctx.fillStyle=KC.sub; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('‹', x+16, y+20); ctx.fillText('›', x+34, y+20);
  // 重新整理
  ctx.fillStyle=KC.sub; ctx.font=`14px sans-serif`;
  ctx.fillText('↻', x+50, y+20);
  // 網址列
  rrp(x+62,y+8,w-80,24,4);
  ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fill();
  ctx.strokeStyle=KC.border; ctx.lineWidth=1; ctx.stroke();
  ctx.font=`13px 'Noto Sans TC',sans-serif`;
  ctx.fillStyle=KC.sub; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(url.length>38? url.slice(0,37)+'…': url, x+70, y+20);
  // 鎖頭
  ctx.fillStyle=KC.green; ctx.font=`12px sans-serif`;
  ctx.fillText('⚿', x+66, y+20);
  ln([x,y+38,x+w,y+38],KC.border,1);
  // 頁面內容
  if(drawContent){
    ctx.save(); ctx.beginPath(); ctx.rect(x+2,y+39,w-4,h-40); ctx.clip();
    alphaDo(ease(u), ()=>drawContent(x+2,y+39,w-4,h-40));
    ctx.restore();
  } else {
    alphaDo(ease(u)*0.3, ()=>{ ctx.fillStyle='#fff'; ctx.fillRect(x+2,y+39,w-4,h-40); });
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   7. 代理迴圈節點：agentNode(x, y, r, label, opts)
      opts.u=淡入  opts.active=0–1（啟動強度）  opts.icon='◎'
   ═══════════════════════════════════════════════════════════════ */
function agentNode(x, y, r, label, opts={}){
  const {u=1, active=0, icon=''} = opts;
  alphaDo(ease(clamp(u,0,1)), ()=>{
    if(active>0.01){
      const glowR=r+12+8*active;
      const g=ctx.createRadialGradient(x,y,r,x,y,glowR+6);
      g.addColorStop(0,`rgba(242,194,48,${0.35*active})`);
      g.addColorStop(1,'rgba(242,194,48,0)');
      circ(x,y,glowR+6,g,'none',0);
    }
    circ(x,y,r,KC.nodeBg, lerp(KC.border,KC.nodeAct,active), lerp(1.5,3,active));
    if(icon){
      ctx.font=`${r*0.9}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=lerp('#7a9bb0','#f2c230',active);
      ctx.fillText(icon, x, y);
    }
    ctx.font=`600 14px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=active>0.5? KC.accent: KC.text;
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(tr(label), x, y+r+8);
  });
}

function agentArrow(x0,y0,x1,y1,opts={}){
  const {u=1, active=0, col=KC.border} = opts;
  if(u<=0) return;
  alphaDo(0.5+0.3*active, ()=>arrow(x0,y0,x1,y1,col,1.5));
  if(active>0.1){
    const n=3;
    for(let i=0;i<n;i++){
      const t=((TT*0.5+i/n)%1);
      circ(lerp(x0,x1,t), lerp(y0,y1,t), 3, KC.accent, 'none', 0);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   8. 工具圖示：toolIcon(x, y, name, opts)
   ═══════════════════════════════════════════════════════════════ */
const TOOL_ICONS={
  '搜尋':{sym:'◎',col:'#58b8d0'},'計算':{sym:'∑',col:'#f2c230'},
  '程式':{sym:'</>',col:'#7dffc4'},'檔案':{sym:'☰',col:'#b37cff'},
  '瀏覽':{sym:'⬡',col:'#7dc8dc'},'日曆':{sym:'▦',col:'#e8572a'},
  'search':{sym:'◎',col:'#58b8d0'},'code':{sym:'</>',col:'#7dffc4'},
  'file':{sym:'☰',col:'#b37cff'},'web':{sym:'⬡',col:'#7dc8dc'},
};
function toolIcon(x, y, name, opts={}){
  const {u=1, active=0, size=40} = opts;
  const info=TOOL_ICONS[name]||{sym:'✦',col:KC.sub};
  alphaDo(ease(clamp(u,0,1)), ()=>{
    const r=size/2;
    rrp(x-r,y-r,size,size,6);
    ctx.fillStyle=active>0.5? info.col+'33': KC.toolBg; ctx.fill();
    ctx.strokeStyle=active>0.5? info.col: KC.border;
    ctx.lineWidth=active>0.5?2:1; ctx.stroke();
    ctx.font=`700 ${Math.floor(size*0.45)}px 'Barlow Condensed',monospace`;
    ctx.fillStyle=active>0.5? info.col: KC.sub;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(info.sym, x, y);
    if(name){
      ctx.font=`11px 'Noto Sans TC',sans-serif`;
      ctx.fillStyle=KC.sub; ctx.textBaseline='top';
      ctx.fillText(tr(name), x, y+r+4);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════
   9. 連線動畫：connLine(x0,y0,x1,y1,opts)
   ═══════════════════════════════════════════════════════════════ */
function connLine(x0,y0,x1,y1,opts={}){
  const {u=1, flow=false, col=KC.border, lw=2, dash=false} = opts;
  if(u<=0) return;
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=lw;
  if(dash) ctx.setLineDash([8,6]);
  ctx.globalAlpha=0.7;
  ctx.beginPath();
  ctx.moveTo(x0,y0); ctx.lineTo(lerp(x0,x1,u), lerp(y0,y1,u));
  ctx.stroke(); ctx.setLineDash([]);
  if(flow && u>=1){
    const n=4;
    for(let i=0;i<n;i++){
      const t=((TT*0.6+i/n)%1);
      circ(lerp(x0,x1,t), lerp(y0,y1,t), 3, col, 'none', 0);
    }
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════
   10. 上下文視窗圖解：contextDesk(x, y, w, h, opts)
   ═══════════════════════════════════════════════════════════════ */
function contextDesk(x, y, w, h, opts={}){
  const {tokens=0, maxTokens=200000, items=[], u=1} = opts;
  alphaDo(ease(clamp(u,0,1)), ()=>{
    rrp(x,y,w,h,8); ctx.fillStyle='rgba(15,36,56,.85)'; ctx.fill();
    ctx.strokeStyle=KC.border; ctx.lineWidth=1.2; ctx.stroke();
    const bx=x+16,by=y+h-30,bw=w-32,bh=12;
    box(bx,by,bw,bh,'rgba(255,255,255,.08)',KC.border,1);
    const ratio=Math.min(tokens/maxTokens,1);
    const barCol=ratio>0.8?KC.orange:ratio>0.5?KC.accent:KC.green;
    const drawn=bw*ratio*clamp(u*2,0,1);
    if(drawn>0) box(bx,by,drawn,bh,barCol,'none',0);
    ctx.font=`600 12px 'Barlow Condensed',sans-serif`;
    ctx.fillStyle=KC.sub; ctx.textAlign='right'; ctx.textBaseline='bottom';
    ctx.fillText(`${Math.round(tokens/1000)}K / ${Math.round(maxTokens/1000)}K tokens`, bx+bw, by-4);
    items.forEach((item,i)=>{
      const ix=x+16+i%(Math.floor((w-32)/90))*90;
      const iy=y+20+Math.floor(i/Math.floor((w-32)/90))*60;
      const a=seg(u, i/Math.max(items.length,1), (i+1)/Math.max(items.length,1));
      alphaDo(ease(a), ()=>{
        rrp(ix,iy,78,46,4); ctx.fillStyle='rgba(42,92,140,.6)'; ctx.fill();
        ctx.strokeStyle=KC.border; ctx.lineWidth=1; ctx.stroke();
        ctx.font=`12px 'Noto Sans TC',sans-serif`;
        ctx.fillStyle=KC.text; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(tr(item).slice(0,6), ix+39, iy+23);
      });
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   11. 模型比較卡：modelCard(x, y, w, name, speed, quality, opts)
   ═══════════════════════════════════════════════════════════════ */
function modelCard(x, y, w, name, speed, quality, opts={}){
  const {u=1, highlight=false} = opts;
  const h=100;
  alphaDo(ease(clamp(u,0,1)), ()=>{
    rrp(x,y,w,h,8);
    ctx.fillStyle=highlight?'rgba(242,194,48,.12)':'rgba(30,58,85,.8)'; ctx.fill();
    ctx.strokeStyle=highlight? KC.accent: KC.border;
    ctx.lineWidth=highlight?2:1; ctx.stroke();
    ctx.font=`700 18px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=highlight? KC.accent: KC.text;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(tr(name), x+12, y+12);
    ctx.font=`12px 'Noto Sans TC',sans-serif`;
    ctx.fillStyle=KC.sub; ctx.textBaseline='top';
    ctx.fillText(tr('速度'), x+12, y+40);
    const sw=Math.floor((w-24)*0.6*speed);
    box(x+12,y+55,Math.floor((w-24)*0.6),8,'rgba(255,255,255,.08)',KC.border,1);
    if(sw>0) box(x+12,y+55,sw,8,KC.green,'none',0);
    ctx.fillStyle=KC.sub; ctx.textAlign='right';
    ctx.fillText(tr('推理'), x+w-12, y+40);
    const qw=Math.floor((w-24)*0.35*quality);
    const qx=x+w-12-Math.floor((w-24)*0.35);
    box(qx,y+55,Math.floor((w-24)*0.35),8,'rgba(255,255,255,.08)',KC.border,1);
    if(qw>0) box(qx,y+55,qw,8,KC.accent,'none',0);
  });
}

/* ═══════════════════════════════════════════════════════════════
   12. 步驟流程圖：flowSteps(steps, startX, y, stepW, u, col)
   ═══════════════════════════════════════════════════════════════ */
function flowSteps(steps, startX, y, stepW, u=1, col=KC.accent){
  const n=steps.length;
  steps.forEach((s,i)=>{
    const x=startX+i*stepW;
    const a=seg(u, i/n, (i+0.5)/n);
    if(i<n-1){
      const la=seg(u,(i+0.4)/n,(i+0.6)/n);
      alphaDo(la, ()=>ln([x+28,y,x+stepW-28,y],col,2));
    }
    const active=a>0.5;
    alphaDo(ease(a), ()=>{
      circ(x,y,24, active?col:'rgba(30,58,85,.8)', active?col:KC.border, active?0:1.5);
      ctx.font=`700 16px 'Barlow Condensed',sans-serif`;
      ctx.fillStyle=active?'#0e2133':KC.sub;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(s.icon||String(i+1), x, y);
      ctx.font=`600 13px 'Noto Sans TC',sans-serif`;
      ctx.fillStyle=active? col: KC.sub; ctx.textBaseline='top';
      ctx.fillText(tr(s.label), x, y+30);
    });
  });
}

/* ═══════════════════════════════════════════════════════════════
   13. 整集背景 claudeBase() 與浮動粒子 floatParticles()
   ═══════════════════════════════════════════════════════════════ */
function claudeBase(){
  const g=ctx.createLinearGradient(0,0,0,900);
  g.addColorStop(0,'#0d1c2a'); g.addColorStop(1,'#07111a');
  ctx.fillStyle=g; ctx.fillRect(0,0,1600,900);
  ctx.strokeStyle='rgba(46,74,102,.18)'; ctx.lineWidth=1;
  for(let gx=0;gx<=1600;gx+=80){ln([gx,0,gx,900],'rgba(46,74,102,.1)',0.5);}

/* ── 文字工具：先翻譯再換行（中日文逐字、英文逐詞） ───────────── */
function _fnt(size,weight,mono){const k=fit*cam.s,sz=Math.max(size,9.5/k);ctx.font=`${weight||500} ${sz}px ${mono?"'Barlow Condensed',monospace":FONT}`;return sz;}
function wrapL(t,size,maxW,weight,mono){
  t=tr(t);_fnt(size,weight,mono);
  const cjk=/[぀-ヿ㐀-鿿]/.test(t);
  const parts=cjk?Array.from(t):t.split(/(\s+)/);
  const out=[];let cur='';
  const NOSTART='。、，．）」』！？：；…ー';
  for(const p of parts){const nx=cur+p;if(ctx.measureText(nx).width>maxW&&cur.trim()&&!(cjk&&NOSTART.includes(p))){out.push(cur.trim());cur=p.trim()?p:'';}else cur=nx;}
  if(cur.trim())out.push(cur.trim());return out;
}
function para(x,y,t,size,col,maxW,lh,weight,mono,align){
  const L=wrapL(t,size,maxW,weight,mono);_fnt(size,weight,mono);
  ctx.fillStyle=col||'#fff';ctx.textAlign=align||'left';ctx.textBaseline='top';
  L.forEach((s,i)=>ctx.fillText(s,x,y+i*lh));ctx.textAlign='left';ctx.textBaseline='alphabetic';
  return L.length*lh;
}
function paraH(t,size,maxW,lh,weight,mono){return wrapL(t,size,maxW,weight,mono).length*lh;}

"小朋友，你有沒有看過媽媽煮湯時，鍋蓋上冒出小水珠？天空也一樣：太陽把海和河的水曬成看不見的水蒸氣，飄到高空變冷，又變回小水滴，聚成雲。水滴越聚越大、太重了，就掉下來變成雨。":["Have you ever seen little drops form on the lid when soup is cooking? The sky works the same way. The sun warms water in seas and rivers into invisible vapor. High up it cools and turns back into tiny droplets that gather into clouds. When the drops grow too big and heavy, they fall as rain.","スープを煮ているとき、なべのふたに小さな水てきがつくのを見たことはあるかな？空も同じです。太陽が海や川の水をあたためて、目に見えない水じょう気にします。空の高いところで冷えると小さな水てきにもどり、集まって雲になります。水てきが大きく重くなると、雨になって落ちてきます。"],

/* ================= episode engine ================= */
const hn=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);};
const SH=EP.shots,SS=[];let TOTAL=0;SH.forEach((s,i)=>{SS[i]=TOTAL;TOTAL+=s.dur;});
let SI=0;
const P2=n=>String(n).padStart(2,'0');

/* world-space text with a minimum on-screen size */
function wt(x,y,t,size,col,weight,align,font,base){
  t=tr(t);const k=fit*cam.s,sz=Math.max(size,9.5/k);
  ctx.font=`${weight||500} ${sz}px ${font||FONT}`;ctx.textAlign=align||'left';ctx.textBaseline=base||'alphabetic';
  ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function wtw(t,size,weight,font){t=tr(t);const k=fit*cam.s,sz=Math.max(size,9.5/k);ctx.font=`${weight||500} ${sz}px ${font||FONT}`;return ctx.measureText(t).width;}
function arrow(x0,y0,x1,y1,col,lw,hs){
  lw=lw||2;hs=hs||lw*4+2;const a=Math.atan2(y1-y0,x1-x0);
  ln([x0,y0,x1-Math.cos(a)*hs*.6,y1-Math.sin(a)*hs*.6],col,lw);
  poly([x1,y1,x1-Math.cos(a-.42)*hs,y1-Math.sin(a-.42)*hs,x1-Math.cos(a+.42)*hs,y1-Math.sin(a+.42)*hs],col);
}
function tag(x,y,t,o){ // filled pill in world coords
  o=o||{};const size=o.size||20,pad=size*.55,w=wtw(t,size,o.weight||700)+pad*2,h=size*1.75;
  let bx=o.align==='center'?x-w/2:o.align==='right'?x-w:x;
  rrp(bx,y-h/2,w,h,o.r===undefined?h/2:o.r);ctx.fillStyle=o.bg||'#f2c230';ctx.fill();
  wt(bx+pad,y+1,t,size,o.fg||'#13232e',o.weight||700,'left',FONT,'middle');return w;
}
function card(x,y,w,h,o){o=o||{};rrp(x,y,w,h,o.r||14);ctx.fillStyle=o.bg||'rgba(255,255,255,.06)';ctx.fill();if(o.st!==false){ctx.strokeStyle=o.st||'rgba(255,255,255,.16)';ctx.lineWidth=o.lw||1.4;ctx.stroke();}}
function diagBG(){
  applyCam({x:800,y:450,s:1});
  ctx.fillStyle='#0e2a3b';ctx.fillRect(VX0,VY0,VX1-VX0,VY1-VY0);
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=50){ctx.moveTo(x,VY0);ctx.lineTo(x,VY1);}for(let y=0;y<=H;y+=50){ctx.moveTo(VX0,y);ctx.lineTo(VX1,y);}ctx.stroke();
}
function camMix(a,b,k){return {x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)};}
/* chart helper in world coords: axes box, returns mapper */
function chartBox(x,y,w,h,o){
  o=o||{};card(x,y,w,h,{bg:'rgba(7,27,39,.75)',r:12});
  const px=x+(o.pl||64),py=y+(o.pt||46),pw=w-(o.pl||64)-(o.pr||24),ph=h-(o.pt||46)-(o.pb||46);
  if(o.title)wt(x+18,y+32,o.title,20,'#f2c230',700);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();
  const gx=o.gx||5,gy=o.gy||4;for(let i=0;i<=gx;i++){ctx.moveTo(px+pw*i/gx,py);ctx.lineTo(px+pw*i/gx,py+ph);}for(let i=0;i<=gy;i++){ctx.moveTo(px,py+ph*i/gy);ctx.lineTo(px+pw,py+ph*i/gy);}ctx.stroke();
  ln([px,py,px,py+ph,px+pw,py+ph],'rgba(255,255,255,.5)',1.4);
  const X=v=>px+pw*(v-o.x0)/(o.x1-o.x0),Y=v=>py+ph-ph*(v-o.y0)/(o.y1-o.y0);
  if(o.xl)wt(px+pw,py+ph+36,o.xl,16,'rgba(227,236,238,.7)',500,'right');
  if(o.yl)wt(px,py-12,o.yl,16,'rgba(227,236,238,.7)',500,'left');
  if(o.xt)o.xt.forEach(v=>wt(X(v),py+ph+20,String(v),16,'rgba(227,236,238,.75)',600,'center',COND));
  if(o.yt)o.yt.forEach(v=>wt(px-10,Y(v)+5,String(v),16,'rgba(227,236,238,.75)',600,'right',COND));
  return {X,Y,px,py,pw,ph};
}

/* ================= localisation of episode data ================= */
function epT(){return LANG==='en'?(EP.en||EP.t):tr(EP.t);}
function epSub(){return LANG==='en'?EP.t:(EP.en||'');}
function loc(i){const s=SH[i];
  if(LANG==='zh')return {t:s.t,sub:s.en||'',d:s.d,s:s.s};
  return {t:LANG==='en'?(s.en||tr(s.t)):tr(s.t),sub:LANG==='en'?s.t:(s.en||''),d:tr(s.d),s:s.s.map(x=>[x[0],tr(x[1])])};}
function seriesLine(){if(!EP.seriesName)return '';return ui(EP.total?'series':'seriesOne',{s:tr(EP.seriesName),n:EP.no,t:EP.total||''});}
function docTitle(){return EP.seriesName?`${P2(EP.no)} ${epT()}｜${tr(EP.seriesName)}`:epT();}

/* ================= frame ================= */
function renderFrame(){
  SI=0;while(SI<SH.length-1&&T>=SS[SI+1])SI++;
  const sh=SH[SI],u=clamp((T-SS[SI])/sh.dur);U=u;TT=T;
  screenSpace();ctx.clearRect(0,0,cssW,cssH);
  if(sh.side){applyCam(sh.cam?sh.cam(u):{x:800,y:450,s:1});(sh.base||EP.base||(typeof sideBase==='function'?sideBase:()=>{}))(u);if(sh.draw)sh.draw(u);(sh.end||EP.end||(typeof sideEnd==='function'?sideEnd:()=>{}))(u);if(sh.fx)sh.fx(u);}
  else{if(sh.cam)applyCam(sh.cam(u));else applyCam({x:800,y:450,s:1});sh.draw(u);}
  drawTicks();drawLabels();if(sh.hud)sh.hud(u);
  const tin=T-SS[SI],tout=SS[SI]+sh.dur-T;let fa=0;
  if(SI>0)fa=Math.max(fa,1-tin/.45);if(SI<SH.length-1)fa=Math.max(fa,1-tout/.45);
  if(fa>0){screenSpace();ctx.fillStyle=`rgba(4,14,22,${clamp(fa)*.92})`;ctx.fillRect(0,0,cssW,cssH);}
  if(T<3.2){ // opening title
    const a=T<2.3?1:1-(T-2.3)/.9;screenSpace();ctx.fillStyle=`rgba(5,22,32,${.82*a})`;ctx.fillRect(0,0,cssW,cssH);
    ctx.globalAlpha=a;const fs=clamp(cssW/20,22,64),mw=cssW*.9;ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.font=`700 ${fs*1.3}px ${COND}`;ctx.fillStyle='#f2c230';ctx.fillText(P2(EP.no),cssW/2,cssH*.43);
    const tt=epT(),tfs=LANG==='en'&&tt.length>26?fs*.8:fs;
    ctx.font=`900 ${tfs}px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(tt,cssW/2,cssH*.43+fs*1.2,mw);
    ctx.font=`500 ${fs*.42}px ${LANG==='en'?FONT:COND}`;ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText(epSub(),cssW/2,cssH*.43+fs*1.85,mw);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
}
function langText(){
  let s='0123456789 MWkVm/s%°→';
  for(const k in DICT)s+=LI<0?k:DICT[k][LI];
  SH.forEach((c,i)=>{const l=loc(i);s+=l.t+l.sub+l.d+l.s.map(x=>x[1]).join('');});
  EP.facts.forEach(f=>{s+=tr(f[0])+tr(f[1])+tr(f[2]);});s+=epT()+tr(EP.lede)+tr(EP.note)+seriesLine();
  for(const k in UI)s+=UI[k][LI+1];return s;
}
function ensureFonts(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  const fam=LANG==='ja'?'"Noto Sans JP"':'"Noto Sans TC"',txt=langText(),jobs=[];
  for(const w of [400,500,700,900])jobs.push(document.fonts.load(`${w} 16px ${fam}`,txt));
  if(LANG==='ja')for(const w of [500,700])jobs.push(document.fonts.load(`${w} 16px "Noto Sans TC"`,txt));
  for(const w of [500,600,700])jobs.push(document.fonts.load(`${w} 16px "Barlow Condensed"`,'0123456789 MWkV'));
  return Promise.all(jobs).then(()=>document.fonts.ready).catch(()=>{});
}

/* ================= UI controller ================= */
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage'),tl=$('timeline'),track=$('tlTrack'),fill=$('tlFill'),head=$('tlHead'),timeEl=$('time');
  const bPlay=$('bPlay'),playIcon=$('playIcon'),cap=$('caption'),cardEl=$('chapcard');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing=!reduce,speed=1,last=0,dirty=true,ended=false,prevC=-1,prevStep=-2,dragging=false,wasPlaying=false;
  const fmt=t=>{t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+P2(t%60);};
  $('mNo').textContent=P2(EP.no);
  SH.forEach(c=>{const d=document.createElement('div');d.className='tl-seg';d.style.flex=c.dur+' 0 0';track.insertBefore(d,fill);});
  const grid=$('shotGrid');
  SH.forEach((c,i)=>{const b=document.createElement('button');b.className='chap';b.type='button';b.innerHTML=`<span class="n">${i+1}</span><span class="t"></span>`;b.addEventListener('click',()=>jump(SS[i]+.001));grid.appendChild(b);});
  const btns=[...grid.children];
  function fillStatic(){
    $('mT').textContent=epT();$('mLede').textContent=tr(EP.lede);$('mSeries').textContent=seriesLine();
    $('facts').innerHTML='';EP.facts.forEach(f=>{const d=document.createElement('div');d.className='fact';const dt=document.createElement('dt');dt.textContent=tr(f[0]);const sm=document.createElement('small');sm.textContent=tr(f[1]);dt.appendChild(sm);const dd=document.createElement('dd');dd.textContent=tr(f[2]);d.append(dt,dd);$('facts').appendChild(d);});
    $('foot').textContent=tr(EP.note);$('cv').setAttribute('aria-label',docTitle());
    btns.forEach((b,i)=>{b.querySelector('.t').textContent=loc(i).t;});
  }
  function resize(){const r=cv.getBoundingClientRect();if(r.width<2)return;cssW=r.width;cssH=r.height;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);fit=cssW/W;dirty=true;}
  if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else window.addEventListener('resize',resize);
  resize();
  function setPlayIcon(){
    playIcon.innerHTML=playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':(ended?'<path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.7A5 5 0 1 0 12 7v3L7.5 6 12 2z"/>':'<path d="M7 4.5v15l12-7.5z"/>');
    bPlay.setAttribute('aria-label',playing?ui('pause'):(ended?ui('replay'):ui('play')));
  }
  function jump(t){T=clamp(t,0,TOTAL-.001);ended=false;dirty=true;setPlayIcon();}
  function togglePlay(){if(ended){T=0;ended=false;playing=true;}else playing=!playing;setPlayIcon();dirty=true;}
  bPlay.addEventListener('click',togglePlay);
  const idx=()=>{let c=0;while(c<SH.length-1&&T>=SS[c+1])c++;return c;};
  $('bPrev').addEventListener('click',()=>{const c=idx();jump(T-SS[c]>1.5?SS[c]+.001:SS[Math.max(0,c-1)]+.001);});
  $('bNext').addEventListener('click',()=>{const c=idx();if(c<SH.length-1)jump(SS[c+1]+.001);else jump(TOTAL-.01);});
  document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));}));
  const bLab=$('bLabels');bLab.addEventListener('click',()=>{SHOWLAB=!SHOWLAB;bLab.setAttribute('aria-pressed',SHOWLAB?'true':'false');dirty=true;});
  $('bFull').addEventListener('click',()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else{const f=stage.requestFullscreen||stage.webkitRequestFullscreen;if(f)f.call(stage);}});
  document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
  function tlFrac(e){const r=track.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width);}
  tl.addEventListener('pointerdown',e=>{dragging=true;wasPlaying=playing;playing=false;tl.setPointerCapture(e.pointerId);jump(tlFrac(e)*TOTAL);});
  tl.addEventListener('pointermove',e=>{if(dragging)jump(tlFrac(e)*TOTAL);});
  const endDrag=()=>{if(!dragging)return;dragging=false;playing=wasPlaying;setPlayIcon();};

  tl.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){jump(T-5);e.preventDefault();e.stopPropagation();}
    else if(e.key==='ArrowRight'){jump(T+5);e.preventDefault();e.stopPropagation();}

  });
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();if($('recDlg').open)return;if(tag==='input'||tag==='textarea')return;
    if(e.key===' '||e.code==='Space'){if(tag==='button')return;e.preventDefault();togglePlay();}
    else if(e.key==='ArrowLeft'&&e.target!==tl){$('bPrev').click();}else if(e.key==='ArrowRight'&&e.target!==tl){$('bNext').click();}
  });
  function updateUI(){
    const c=SI,L=loc(c),f=T/TOTAL*100;
    fill.style.width=f+'%';head.style.left=f+'%';
    tl.setAttribute('aria-valuenow',Math.round(f));tl.setAttribute('aria-valuetext',`${c+1} ${L.t}${ui('sep')}${fmt(T)}`);
    timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
    if(c!==prevC){
      prevC=c;prevStep=-2;cardEl.classList.remove('show');
      setTimeout(()=>{$('ccNo').innerHTML=`${P2(EP.no)}<small>${ui('shotOf',{i:c+1,n:SH.length})}</small>`;$('ccT').textContent=L.t;$('ccE').textContent=L.sub;cardEl.classList.add('show');},reduce?0:180);
      $('iNo').textContent=c+1;$('iT').textContent=L.t;$('iE').textContent=L.sub;$('iD').textContent=L.d;
      $('iS').innerHTML='';L.s.forEach(s=>{const li=document.createElement('li');li.textContent=s[1];$('iS').appendChild(li);});
      btns.forEach((b,i)=>{b.classList.toggle('active',i===c);b.classList.toggle('past',i<c);if(i===c)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
    }
    let si=0;L.s.forEach((s,i)=>{if(U>=s[0])si=i;});
    if(si!==prevStep){prevStep=si;cap.innerHTML='<span class="dot"></span>';cap.appendChild(document.createTextNode(L.s[si][1]));[...$('iS').children].forEach((li,i)=>{li.className=i<si?'done':i===si?'now':'';});}
  }

  /* ---------- language ---------- */
  function setLang(l,save){
    LANG=LANGS.includes(l)?l:'zh';LI=LANG==='zh'?-1:LANG==='en'?0:1;
    document.documentElement.lang=LANG==='zh'?'zh-Hant-TW':LANG;
    FONT=LANG==='ja'?FONT_JP:FONT_TC;
    COND='"Barlow Condensed","Arial Narrow",'+(LANG==='ja'?'"Noto Sans JP",':'')+'"Noto Sans TC","Noto Sans CJK TC",sans-serif';
    document.title=docTitle();
    document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=ui(e.dataset.i18n);});
    document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',ui(e.dataset.i18nAria)));
    document.querySelectorAll('[data-i18n-title]').forEach(e=>{e.title=ui(e.dataset.i18nTitle);});
    document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG?'true':'false'));
    fillStatic();prevC=-1;prevStep=-2;setPlayIcon();dirty=true;
    if(recDlg.open)recSummary();
    if(save){try{localStorage.setItem(LANG_KEY,LANG);}catch(e){}}
    document.dispatchEvent(new CustomEvent('langchange',{detail:LANG}));
    ensureFonts().then(()=>{dirty=true;});
  }
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(!recBusy)setLang(b.dataset.lang,true);}));

  /* ---------- MP4 export (offline, frame-accurate: WebCodecs + mp4-muxer) ---------- */
  const recDlg=$('recDlg'),recGo=$('recGo'),recCancel=$('recCancel'),recDl=$('recDl'),recSum=$('recSum'),recProg=$('recProg'),recBar=$('recBar'),recStat=$('recStat'),recPrev=$('recPrev'),recNote=$('recNote');
  const REC={speed:1,range:'all',res:1080,fps:30};
  let recBusy=false,recAbort=false,recUrl=null,recChap=0;
  const LW=1280,LH=720;
  recDlg.querySelectorAll('[data-opt]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    if(recBusy)return;const k=g.dataset.opt;REC[k]=k==='range'?b.dataset.v:+b.dataset.v;
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));recSummary();})));
  function recSpan(){return REC.range==='chap'?[SS[recChap],SS[recChap]+SH[recChap].dur]:[0,TOTAL];}
  function recBitrate(){return (REC.res>=1080?8e6:5e6)*(REC.fps>30?1.5:1);}
  function recSummary(){
    const [t0,t1]=recSpan(),d=(t1-t0)/REC.speed,f=Math.ceil(d*REC.fps),m=Math.ceil(recBitrate()*d/8/1e6);
    let s=ui('sum',{d:fmt(d),f:f.toLocaleString('en-US'),m:m});
    if(REC.range==='chap')s+=ui('sumChap',{c:(recChap+1)+' '+loc(recChap).t});
    recSum.textContent=s;
  }
  function recStatus(msg,err){recStat.textContent=msg;recStat.classList.toggle('err',!!err);}
  $('bRec').addEventListener('click',()=>{
    recChap=idx();playing=false;setPlayIcon();
    if(!recBusy){recProg.hidden=true;recDl.hidden=true;recStatus('');recGo.textContent=ui('start');}
    recSummary();if(recDlg.showModal)recDlg.showModal();else recDlg.setAttribute('open','');
  });
  $('recX').addEventListener('click',()=>{if(recBusy)recAbort=true;recDlg.close();});
  recDlg.addEventListener('cancel',e=>{if(recBusy)e.preventDefault();});
  recCancel.addEventListener('click',()=>{recAbort=true;});
  recGo.addEventListener('click',()=>{if(!recBusy)recordVideo();});
  const mch=new MessageChannel(),mq=[];mch.port1.onmessage=()=>{const f=mq.shift();if(f)f();};
  const yieldNow=()=>new Promise(r=>{mq.push(r);mch.port2.postMessage(0);});
  const breathe=()=>document.hidden?yieldNow():new Promise(r=>setTimeout(r,0));
  function wrapLines(text,maxW){
    const toks=text.match(/[A-Za-z0-9À-ÿ().,:;'’"%°–\-\/+&]+\s*|\s+|\S/g)||[];
    const out=[];let cur='';
    for(const t of toks){const next=cur+t;if(cur.trim()&&ctx.measureText(next.trimEnd()).width>maxW){out.push(cur.trimEnd());cur=t.trimStart();}else cur=next;}
    if(cur.trim())out.push(cur.trimEnd());return out.length?out:[''];
  }
  /* the chapter card, caption and scale note live in HTML on the page, so the video draws them onto the canvas */
  function drawOverlays(spd){
    screenSpace();const c=SI,L=loc(c);
    const vt=(T-SS[c])/spd,a=clamp((vt-.18)/.5);
    if(a>0&&T>=3.2){
      ctx.save();ctx.globalAlpha=a;ctx.translate(0,-6*(1-a));
      const x0=clamp(cssW*.02,10,22),y0=clamp(cssW*.02,10,20),nS=clamp(cssW*.046,30,58),tS=clamp(cssW*.021,15,26),eS=clamp(cssW*.0135,12,17);
      const inner=tS*1.2+eS*1.6,bh=Math.max(nS*.9,inner),no=P2(EP.no),sub=ui('shotOf',{i:c+1,n:SH.length});
      ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.font=`700 ${nS}px ${COND}`;const nw=ctx.measureText(no).width;
      ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=12;ctx.shadowOffsetY=2;ctx.fillStyle='#f2c230';ctx.fillText(no,x0,y0+nS*.78);
      ctx.font=`600 ${nS*.42}px ${COND}`;ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText(sub,x0+nw+4,y0+nS*.78);const sw=ctx.measureText(sub).width;
      const bx=x0+nw+sw+14;ctx.shadowColor='transparent';ctx.fillStyle='#f2c230';ctx.fillRect(bx,y0,3,bh);
      const tx=bx+15,ty=y0+(bh-inner)/2;
      ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=10;ctx.font=`900 ${tS}px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(L.t,tx,ty+tS*.98,cssW*.6);
      ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;ctx.shadowOffsetY=1;ctx.font=`500 ${eS}px ${COND}`;ctx.fillStyle='rgba(255,255,255,.82)';ctx.fillText(L.sub,tx,ty+tS*1.2+eS*1.12,cssW*.6);
      ctx.restore();
    }
    if(cssW>=820){ctx.font=`400 11px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='top';ctx.fillStyle='rgba(255,255,255,.62)';ctx.fillText(ui('scaleNote'),cssW-12,10);ctx.textAlign='left';}
    if(T<3.2)return;
    let si=0;L.s.forEach((s,i)=>{if(U>=s[0])si=i;});
    const fs=clamp(cssW*.015,12,17),lh=fs*1.6,px=16,py=7,dotW=16,maxBox=Math.min(cssW*.88,760);
    ctx.font=`500 ${fs}px ${FONT}`;
    const lines=wrapLines(L.s[si][1],maxBox-px*2-dotW);
    const tw=Math.max(...lines.map((l,i)=>ctx.measureText(l).width+(i?0:dotW)));
    const bw=Math.min(maxBox,tw+px*2),bh=lines.length*lh+py*2,bx=(cssW-bw)/2,by=cssH-clamp(cssW*.018,8,20)-bh;
    rrp(bx,by,bw,bh,10);ctx.fillStyle='rgba(7,26,37,.78)';ctx.fill();
    ctx.textBaseline='middle';ctx.textAlign='left';
    lines.forEach((l,i)=>{const w=ctx.measureText(l).width+(i?0:dotW),lx=(cssW-w)/2,ly=by+py+lh*(i+.5);
      if(!i){circ(lx+4,ly,4,'#f2c230');}ctx.fillStyle='#f2f6f7';ctx.fillText(l,lx+(i?0:dotW),ly+.5);});
  }
  function renderExportFrame(ectx,t,spd,d){
    const sv={ctx,cssW,cssH,dpr,fit,T};
    ctx=ectx;cssW=LW;cssH=LH;dpr=d;fit=cssW/W;T=t;
    try{renderFrame();drawOverlays(spd);}
    finally{ctx=sv.ctx;cssW=sv.cssW;cssH=sv.cssH;dpr=sv.dpr;fit=sv.fit;T=sv.T;}
  }
  async function pickConfig(w,h,fps,br){
    const list=[['avc','avc1.640033'],['avc','avc1.64002A'],['avc','avc1.640028'],['avc','avc1.4D4033'],['avc','avc1.4D402A'],['avc','avc1.4D4028'],['avc','avc1.42E033'],['avc','avc1.42E02A'],['avc','avc1.42E028'],['avc','avc1.42001F'],
      ['vp9','vp09.00.40.08'],['vp9','vp09.00.31.08'],['av1','av01.0.08M.08'],['av1','av01.0.05M.08']];
    for(const [mux,codec] of list){const cfg={codec,width:w,height:h,bitrate:br,framerate:fps};if(mux==='avc')cfg.avc={format:'avc'};
      try{const r=await VideoEncoder.isConfigSupported(cfg);if(r&&r.supported)return {mux,cfg};}catch(e){}}
    return null;
  }
  async function recordVideo(){
    recProg.hidden=false;recDl.hidden=true;recBar.style.width='0%';
    if(typeof VideoEncoder==='undefined'||typeof VideoFrame==='undefined'||typeof Mp4Muxer==='undefined'){recNote.hidden=true;recStatus(ui('stNoSup'),true);return;}
    recBusy=true;recAbort=false;recNote.hidden=false;recGo.disabled=true;recCancel.hidden=false;recDlg.classList.add('busy');
    if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null;}
    recStatus(ui('stPrep'));
    const d=REC.res/720,VW=Math.round(LW*d/2)*2,VH=Math.round(LH*d/2)*2,fps=REC.fps,spd=REC.speed,[t0,t1]=recSpan();
    const n=Math.ceil((t1-t0)/spd*fps),us=1e6/fps,keyEvery=fps*2;
    let enc=null,encErr=null;
    try{
      await ensureFonts();
      const pick=await pickConfig(VW,VH,fps,recBitrate());
      if(!pick)throw new Error('__nocodec');const cfg=pick.cfg;
      const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:pick.mux,width:VW,height:VH,frameRate:fps},fastStart:'in-memory',firstTimestampBehavior:'offset'});
      enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{encErr=e;}});
      enc.configure(cfg);
      const ec=document.createElement('canvas');ec.width=VW;ec.height=VH;
      const ectx=ec.getContext('2d',{alpha:false}),pctx=recPrev.getContext('2d');
      const t0ms=performance.now();let lastUI=0;
      for(let i=0;i<n;i++){
        if(recAbort||encErr)break;
        const t=Math.min(t0+i/fps*spd,t1-.001);
        renderExportFrame(ectx,t,spd,d);
        const fr=new VideoFrame(ec,{timestamp:Math.round(i*us),duration:Math.round(us)});
        enc.encode(fr,{keyFrame:i%keyEvery===0});fr.close();
        while(enc.encodeQueueSize>6&&!encErr&&!recAbort)await yieldNow();
        const now=performance.now();
        if(now-lastUI>150||i===n-1){lastUI=now;const p=(i+1)/n,el=(now-t0ms)/1000;recBar.style.width=(p*100).toFixed(1)+'%';recStatus(ui('stRun',{p:Math.floor(p*100),e:fmt(el/p-el)}));pctx.drawImage(ec,0,0,recPrev.width,recPrev.height);await breathe();}
      }
      if(encErr)throw encErr;
      if(recAbort){try{enc.close();}catch(e){}recBar.style.width='0%';recStatus(ui('stCancel'));return;}
      recStatus(ui('stFin'));await breathe();
      await enc.flush();if(encErr)throw encErr;enc.close();
      muxer.finalize();
      const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
      recUrl=URL.createObjectURL(blob);recDl.href=recUrl;
      recDl.download=`${EP.slug||'episode'}-${P2(EP.no)}_${LANG}_${REC.range==='chap'?'shot'+P2(recChap+1)+'_':''}${spd}x_${REC.res}p${fps}.mp4`;
      recDl.hidden=false;recDl.click();
      recStatus(ui('stDone',{s:(blob.size/1048576).toFixed(1)})+(pick.mux==='avc'?'':' '+ui('stAlt',{c:pick.mux.toUpperCase()})));recGo.textContent=ui('again');
    }catch(e){
      const msg=e&&e.message;recStatus(msg==='__nocodec'?ui('stNoCodec'):ui('stErr')+(msg||String(e)),true);
      try{if(enc&&enc.state!=='closed')enc.close();}catch(_){}
    }finally{
      recBusy=false;recGo.disabled=false;recCancel.hidden=true;recNote.hidden=true;recDlg.classList.remove('busy');dirty=true;
    }
  }

  function loop(ts){
    const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
    if(playing&&!ended){T+=dt*speed;if(T>=TOTAL){T=TOTAL-.001;ended=true;playing=false;setPlayIcon();}dirty=true;}
    if(dirty&&cssW>2){renderFrame();updateUI();dirty=false;}
    requestAnimationFrame(loop);
  }
  let initLang='zh';
  try{const q=(new URLSearchParams(location.search).get('lang')||'').slice(0,2).toLowerCase(),sv=localStorage.getItem(LANG_KEY)||localStorage.getItem('owf-lang'),nv=(navigator.language||'').toLowerCase();
    initLang=LANGS.includes(q)?q:LANGS.includes(sv)?sv:nv.startsWith('ja')?'ja':nv.startsWith('zh')?'zh':nv.startsWith('en')?'en':'zh';}catch(e){}
  setLang(initLang,false);
  setPlayIcon();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;});
  window.__ow={seek:t=>{T=t;dirty=true;},pause:()=>{playing=false;setPlayIcon();},shot:i=>{T=SS[i]+.5;dirty=true;},setLang:l=>setLang(l,false),keep:()=>[EP.t,...SH.map(s=>s.t),...QA_KEEP],get T(){return T;},SS,TOTAL};
  requestAnimationFrame(loop);
})();

</script>
