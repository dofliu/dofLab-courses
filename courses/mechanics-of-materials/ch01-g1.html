<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>[MOM-CH1-G1] Stress - 應力探索：橋樑承受的力量</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Saira+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3a5c; --navy2:#264d75; --orange:#e8640a; --orange2:#ff8a3d; --bg:#f5f6fa; --panel:#ffffff;
  --ink:#16283d; --muted:#5a6b80; --line:#d5dbe6; --ok:#12875a; --okbg:#e2f5ec; --bad:#c9372c; --badbg:#fbe6e3;
  --steel:#8a9bb0; --sky:#dcebf8; --tint:#fff3ea;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.num,.mono{font-family:"Saira Condensed","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff}
.top .in{max-width:1040px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{flex:1;min-width:220px;line-height:1.3}
.brand b{font-size:1.02rem;font-weight:900;letter-spacing:.02em}
.brand small{display:block;color:#b8c8da;font-size:.78rem}
.who{font-size:.82rem;color:#d6e1ee;background:rgba(255,255,255,.08);padding:3px 10px;border-radius:6px}
.tabs{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-width:92px;border:0;background:transparent;color:#b8c8da;padding:8px 6px 10px;cursor:pointer;font-weight:700;font-size:.88rem;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--orange)}
.tabs button[disabled]{opacity:.4;cursor:not-allowed}
.tabs .ck{color:#6fe0a8;margin-left:3px}
.prog{height:6px;background:#0f2640}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange2));transition:width .5s ease}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.view{animation:slide .45s ease}
@keyframes slide{from{opacity:.2;transform:translateX(18px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin:0 0 16px}
.card.hero{padding:0;overflow:hidden}
h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.25;margin:0 0 6px;font-weight:900;text-wrap:balance;color:var(--navy)}
h2{font-size:1.35rem;margin:0 0 8px;font-weight:900;color:var(--navy);text-wrap:balance}
h3{font-size:1.06rem;margin:14px 0 6px;color:var(--navy)}
.eyebrow{font-size:.75rem;letter-spacing:.14em;font-weight:700;color:var(--orange);text-transform:uppercase}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;background:var(--orange);color:#fff;font-weight:700;padding:10px 20px;border-radius:8px;cursor:pointer;transition:transform .1s,background .2s}
.btn:hover{background:#cf5606}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--navy)}
.btn.sec:hover{background:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* engineer talk */
.talk{display:flex;gap:12px;align-items:flex-end;margin:12px 0}
.talk svg{flex:none}
.bubble{position:relative;background:var(--tint);border:1.5px solid #f3c39f;border-radius:14px;padding:10px 14px;max-width:64ch}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;border:8px solid transparent;border-right-color:#f3c39f;border-left:0}
.bubble .nm{font-size:.76rem;font-weight:700;color:var(--orange);display:block}
.bubble p{margin:2px 0}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* formula */
.fx{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:6px 16px;font-family:"Saira Condensed","Noto Sans TC",sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:.02em}
.fx em{color:var(--orange2);font-style:normal}
/* svg frames */
.fig{background:var(--sky);border-radius:10px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:320px}
/* choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.choice{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;font-weight:500;transition:border-color .2s,background .2s}
.choice:hover:not([disabled]){border-color:var(--orange);background:var(--tint)}
.choice.sel{border-color:var(--navy);background:#e7eef7;font-weight:700}
.choice.right{border-color:var(--ok);background:var(--okbg);color:#0a4d33}
.choice.wrong{border-color:var(--bad);background:var(--badbg);color:#6b1a13}
.choice[disabled]{cursor:default}
.fb{margin:10px 0;padding:10px 14px;border-radius:8px;border-left:5px solid var(--ok);background:var(--okbg);animation:slide .3s ease}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb .ic{font-weight:900;margin-right:4px}
.ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.ans input{width:160px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-family:"Saira Condensed",sans-serif;font-size:1.25rem}
.ans input:focus{border-color:var(--orange)}
.ans .u{font-weight:700;color:var(--muted)}
/* sliders */
.lab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.lab{grid-template-columns:1fr}}
label.sl{display:flex;justify-content:space-between;margin:12px 0 2px;font-weight:700;font-size:.95rem}
label.sl span{font-family:"Saira Condensed",sans-serif;color:var(--orange);font-size:1.2rem}
input[type=range]{width:100%;accent-color:var(--orange)}
.readout{background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:12px}
.readout .big{font-family:"Saira Condensed",sans-serif;font-size:2.4rem;font-weight:800;line-height:1;color:var(--navy)}
.gauge{height:14px;border-radius:8px;background:#e3e8ef;position:relative;overflow:hidden;margin-top:8px}
.gauge i{position:absolute;inset:0 auto 0 0;transition:width .2s,background .2s}
.gauge .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}
.pill{display:inline-block;padding:1px 10px;border-radius:20px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:#fff1d6;color:#9a5b00}
.seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
/* steps */
.steps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.step{border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;padding:10px 14px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--navy);display:grid;place-items:center;font-weight:900;font-family:"Saira Condensed",sans-serif;font-size:1.1rem}
.step.on{border-color:var(--orange);background:var(--tint)}
.step.on .n{background:var(--orange);color:#fff}
.step .d{display:none;margin-top:4px;color:var(--ink)}
.step.on .d{display:block;animation:slide .3s ease}
.step .t{font-weight:700;color:var(--navy)}
.hl{transition:opacity .35s}
.dim .hl{opacity:.18}
.dim .hl.act{opacity:1}
/* practice & test */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-family:"Saira Condensed",sans-serif;font-size:1.3rem;font-weight:800;color:var(--navy)}
.bar{height:10px;background:#e3e8ef;border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-family:"Saira Condensed",sans-serif}
.dots button.cur{border-color:var(--orange);color:var(--orange)}
.dots button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.dots button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.dots button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.timer{font-family:"Saira Condensed",sans-serif;font-size:1.6rem;font-weight:800;color:var(--navy);background:var(--bg);padding:2px 14px;border-radius:8px}
.timer.low{color:#fff;background:var(--bad)}
.sol{background:var(--bg);border-radius:8px;padding:10px 14px;margin-top:8px;border:1px dashed var(--steel)}
.sol ol{margin:4px 0;padding-left:1.3em}
.given{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.given span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:.9rem}
/* form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.form label{display:flex;flex-direction:column;font-weight:700;font-size:.9rem;gap:4px;color:var(--navy)}
.form input{padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-weight:400}
.form input:focus{border-color:var(--orange)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.plan div{border-top:3px solid var(--navy);background:var(--bg);padding:10px 12px;border-radius:0 0 8px 8px}
.plan div b{display:block;color:var(--navy)}
.plan div small{color:var(--muted)}
.plan div .min{float:right;color:var(--orange);font-family:"Saira Condensed",sans-serif;font-weight:700}
/* reward */
.burst{position:fixed;pointer-events:none;z-index:40;font-size:1.3rem;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.plus{position:fixed;z-index:41;pointer-events:none;font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:1.6rem;color:var(--orange);animation:up 1s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* report */
.report table{width:100%;border-collapse:collapse;font-size:.92rem}
.report th,.report td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.report th{color:var(--muted);font-weight:700;font-size:.8rem;letter-spacing:.04em}
.tbl{overflow-x:auto}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px;margin:12px 0}
.meta div{border-bottom:1px solid var(--line);padding:4px 0}
.meta small{display:block;color:var(--muted);font-size:.75rem}
.gradebox{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:14px 0}
.grade{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-family:"Saira Condensed",sans-serif;font-size:3.2rem;font-weight:800}
.tot{font-family:"Saira Condensed",sans-serif;font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1}
.hanger{transition:stroke .15s,stroke-width .15s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .top,.noprint,.talk .bob{display:none!important}
  body{background:#fff}
  .wrap{padding:0}
  .card{border:1px solid #999;break-inside:avoid}
  .view>*:not(.report){display:none!important}
}
</style>

<header class="top noprint">
  <div class="in">
    <div class="brand"><b>[MOM-CH1-G1] 應力探索：橋樑承受的力量</b><small>材料力學 Mechanics of Materials｜第 1 章 Stress｜遊戲 1 / 3</small></div>
    <div class="who" id="who">尚未登錄學生資料</div>
    <nav class="tabs" id="tabs" aria-label="遊戲階段"></nav>
  </div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
</header>
<main class="wrap" id="app"></main>

<script>
/* ============ 工具 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const PI=Math.PI, areaC=d=>PI*d*d/4;
const f=(x,d=1)=>Number(x).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const near=(v,a,t=0.02)=>isFinite(v)&&Math.abs(v-a)<=Math.abs(a)*t;
const num=s=>parseFloat(String(s).replace(/,/g,'').replace('，','').trim());
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frac=(p,q)=>{const g=gcd(p,q);p/=g;q/=g;return q===1?`${p}`:`${p}/${q}`};

const S={
  stu:{name:'',id:'',cls:''}, phase:'start',
  done:{p1:false,p2:false,p3:false,p4:false},
  quiz:[null,null,null], exStep:[0,0],
  prac:{i:0,res:[null,null,null,null],tries:[0,0,0,0],pts:[0,0,0,0],shown:[false,false,false,false]},
  test:null, reportAt:null
};

/* ============ 卡通工程師 ============ */
function eng(mood='happy',size=86){
  const mouth={happy:'<path d="M42 66 q8 8 16 0" stroke="#5b2a14" stroke-width="3" fill="none" stroke-linecap="round"/>',
    wow:'<ellipse cx="50" cy="67" rx="5" ry="6" fill="#5b2a14"/>',
    think:'<path d="M43 67 h13" stroke="#5b2a14" stroke-width="3" stroke-linecap="round"/>',
    sad:'<path d="M42 70 q8 -7 16 0" stroke="#5b2a14" stroke-width="3" fill="none" stroke-linecap="round"/>'}[mood];
  return `<svg class="bob" viewBox="0 0 100 124" width="${size}" height="${size*1.24}" aria-hidden="true">
   <path d="M18 124 v-18 q0 -18 32 -18 q32 0 32 18 v18z" fill="#1a3a5c"/>
   <path d="M38 88 l12 14 l12 -14" fill="#f5f6fa"/><rect x="47" y="96" width="6" height="28" fill="#e8640a"/>
   <rect x="22" y="100" width="10" height="3" fill="#f2c200"/><rect x="68" y="100" width="10" height="3" fill="#f2c200"/>
   <rect x="64" y="104" width="22" height="18" rx="2" fill="#fff" stroke="#1a3a5c" stroke-width="2" transform="rotate(-10 75 113)"/>
   <line x1="68" y1="110" x2="80" y2="108" stroke="#8a9bb0" stroke-width="1.5"/><line x1="68" y1="114" x2="82" y2="112" stroke="#8a9bb0" stroke-width="1.5"/>
   <circle cx="50" cy="60" r="24" fill="#ffd7b5" stroke="#1a3a5c" stroke-width="2"/>
   <circle cx="41" cy="58" r="7" fill="none" stroke="#1a3a5c" stroke-width="2"/><circle cx="59" cy="58" r="7" fill="none" stroke="#1a3a5c" stroke-width="2"/>
   <line x1="48" y1="58" x2="52" y2="58" stroke="#1a3a5c" stroke-width="2"/>
   <circle cx="41" cy="58" r="2.6" fill="#1a3a5c"/><circle cx="59" cy="58" r="2.6" fill="#1a3a5c"/>
   <circle cx="33" cy="67" r="3.5" fill="#ff9d7a" opacity=".55"/><circle cx="67" cy="67" r="3.5" fill="#ff9d7a" opacity=".55"/>
   ${mouth}
   <path d="M24 48 a26 24 0 0 1 52 0z" fill="#e8640a" stroke="#1a3a5c" stroke-width="2"/>
   <rect x="18" y="45" width="64" height="7" rx="3.5" fill="#c95307" stroke="#1a3a5c" stroke-width="2"/>
   <rect x="45" y="25" width="10" height="21" rx="4" fill="#ff8a3d"/>
   <text x="50" y="42" font-size="7" text-anchor="middle" fill="#fff" font-weight="900">σ</text>
  </svg>`;}
const talk=(t,m='happy',sz)=>`<div class="talk">${eng(m,sz)}<div class="bubble"><span class="nm">林工程師 · 橋樑結構技師</span><p>${t}</p></div></div>`;

/* ============ 獎勵動畫 ============ */
function reward(ev,pts){
  const r=ev&&ev.target?ev.target.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};
  const x=r.left+r.width/2,y=r.top;
  const ch=['★','✦','●','▲'],cl=['#e8640a','#1a3a5c','#12875a','#f2c200'];
  for(let i=0;i<16;i++){const s=document.createElement('span');s.className='burst';s.textContent=ch[i%4];s.style.color=cl[i%4];
    s.style.left=x+'px';s.style.top=y+'px';const a=i/16*2*PI;s.style.setProperty('--dx',Math.cos(a)*(60+Math.random()*50)+'px');s.style.setProperty('--dy',Math.sin(a)*(60+Math.random()*50)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}
  if(pts){const p=document.createElement('div');p.className='plus';p.textContent='+'+pts;p.style.left=(x+10)+'px';p.style.top=(y-20)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}
}

/* ============ 導覽 ============ */
const PH=[['start','開始'],['p1','① 概念理解'],['p2','② 範例遊戲'],['p3','③ 練習關卡'],['p4','④ 測試挑戰'],['report','成績報告']];
function progress(){
  let p=0;if(S.stu.id)p+=5;
  p+=S.quiz.filter(x=>x!==null).length*5; if(S.done.p1)p=Math.max(p,20);
  p+= (S.exStep[0]+S.exStep[1])/8*20; if(S.done.p2)p=Math.max(p,45);
  if(S.done.p1&&S.done.p2) p=Math.max(p,45);
  p+=S.prac.res.filter(x=>x!==null).length*6.25; if(S.done.p3)p=Math.max(p,70);
  if(S.test)p=Math.max(p,70+S.test.ans.filter(a=>a!==null&&a!=='').length*5);
  if(S.done.p4)p=100;
  $('#prog').style.width=Math.min(100,p)+'%';
}
function tabs(){
  $('#tabs').innerHTML=PH.map(([k,n])=>{
    const lock=(k!=='start'&&!S.stu.id)||(k==='report'&&!S.done.p4);
    const dn=S.done[k]?'<span class="ck">✔</span>':'';
    return `<button class="${S.phase===k?'on':''}" ${lock?'disabled':''} onclick="go('${k}')">${n}${dn}</button>`}).join('');
  $('#who').textContent=S.stu.id?`${S.stu.name}｜${S.stu.cls}｜${S.stu.id}`:'尚未登錄學生資料';
  progress();
}
function go(k){if(S.phase==='p4'&&k!=='p4'&&S.test&&!S.test.submitted){/* 計時繼續 */}
  S.phase=k;render();scrollTo({top:0,behavior:'smooth'});}
function render(){tabs();const v={start,p1,p2,p3,p4,report}[S.phase];$('#app').innerHTML='<div class="view" id="v"></div>';v($('#v'));}

/* ============ 橋樑 SVG（首頁 & Phase1） ============ */
function bridgeSVG(){
  const hs=[];for(let i=0;i<15;i++){const x=90+i*30;const t=(x-300)/210;const yc=70+ (1-t*t)*0; hs.push(x);}
  const cableY=x=>{const t=(x-300)/210;return 190-120*(1-t*t)+0;}; // tower top y=70 at x=90,510; sag lowest 190 at x=300
  return `<svg viewBox="0 0 600 300" role="img" aria-label="吊橋：卡車駛過時，附近吊索拉力增大">
   <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2f5"/><stop offset="1" stop-color="#eef4fb"/></linearGradient></defs>
   <rect width="600" height="300" fill="url(#sky)"/>
   <circle cx="520" cy="46" r="20" fill="#ffd27a" opacity=".8"/>
   <rect y="252" width="600" height="48" fill="#6f9fc9"/><path d="M0 262 q20 -5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#9cc0e0" fill="none" stroke-width="2"/>
   <path d="M0 216 L60 216 L60 252 L0 252Z" fill="#8a7a66"/><path d="M540 216 L600 216 L600 252 L540 252Z" fill="#8a7a66"/>

let raf=null;
function animBridge(){
  if(raf)cancelAnimationFrame(raf);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let t0=null;
  const step=ts=>{const tr=$('#truck');if(!tr){raf=null;return;}
    if(!t0)t0=ts;const u=((ts-t0)/9000)%1;const x=-70+u*740;tr.setAttribute('transform',`translate(${x} 0)`);
    const cx=x+30;let mx=null,mv=0;
    $$('#hangers .hanger').forEach(h=>{const hx=+h.dataset.x;const k=Math.max(0,1-Math.abs(hx-cx)/60);
      h.setAttribute('stroke',k>0.05?`rgb(${Math.round(138+(232-138)*k)},${Math.round(155+(100-155)*k)},${Math.round(176+(10-176)*k)})`:'#8a9bb0');h.setAttribute('stroke-width',2+k*2.5);
      if(k>mv){mv=k;mx=hx;}});
    const tag=$('#tag');if(mx&&mv>0.3){tag.setAttribute('opacity',1);tag.setAttribute('transform',`translate(${mx-48} 128)`);$('#tagt').textContent=`σ ≈ ${f(40+mv*103,0)} MPa`;}else tag.setAttribute('opacity',0);
    raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);
}

  {const P=vary(90,5),al=vary(150,5),A=P*1000/al,d=Math.sqrt(4*A/PI);
   Q.push({type:'calc',title:'最小直徑設計',q:`設計一根承受 <b>${P} kN</b> 拉力的吊桿，容許應力 <b>${al} MPa</b>。實心圓棒的最小直徑為多少 mm？`,ans:d,u:'mm',disp:f(d,2)+' mm',
    sol:`A = ${P*1000} ÷ ${al} = ${f(A)} mm²；d = √(4A/π) = ${f(d,2)} mm`});}
  {const k=pick([2,3]),m=pick([2,3,4]);const cand=[[m,k*k],[m,k],[m*k*k,1],[m*k,1]];
   const opts=shuffle(cand.map((c,i)=>({t:`原來的 ${frac(c[0],c[1])} 倍`,ok:i===0})),r);
   Q.push({type:'mc',title:'比例判斷',q:`一根圓形吊索，若載重變為原來的 <b>${m} 倍</b>，同時直徑也加大為原來的 <b>${k} 倍</b>，則平均正應力會變為？`,o:opts.map(o=>o.t),a:opts.findIndex(o=>o.ok),
    disp:`原來的 ${frac(m,k*k)} 倍`,sol:`σ ∝ P / d² → ${m} / ${k}² = ${frac(m,k*k)} 倍`});}
  return {seed,seedId:id,Q,ans:[null,null,null,null,null],i:0,left:900,submitted:false,started:false,ok:[]};
}
let tick=null;
function p4(v){
  if(!S.test||S.test.seedId!==S.stu.id&&!S.test.submitted)S.test=genTest(S.stu.id);
  const T=S.test;
  if(T.submitted){v.innerHTML=`<section class="card"><h2>測試已交卷</h2><p>你的測試已經完成並計分。</p><button class="btn" onclick="go('report')">查看成績報告</button></section>`;return;}
  if(!T.started){
    v.innerHTML=`<section class="card"><div class="eyebrow">Phase 4 · 測試挑戰 · 15 分鐘</div><h2>吊橋安全檢查員考核</h2>
     ${talk('這是正式測試！請確認你的資料，題目數值會依你的學號產生。共 <b>5 題</b>，每題 20 分，<b>全部作答後才能交卷</b>。計時 15 分鐘，時間到會自動交卷。數值題誤差 2% 內算對。','think')}
     <div class="meta"><div><small>姓名</small>${esc(S.stu.name)}</div><div><small>學號</small>${esc(S.stu.id)}</div><div><small>班級</small>${esc(S.stu.cls)}</div><div><small>題目種子</small><span class="num">#${T.seed}</span></div></div>
     <div class="row"><button class="btn" id="tgo">資料正確，開始測試</button><button class="btn ghost" onclick="go('start')">修改資料</button></div></section>`;
    $('#tgo').onclick=()=>{T.started=true;T.startAt=Date.now();startTick();p4(v);};return;}
  const q=T.Q[T.i],answered=T.ans.filter(a=>a!==null&&a!=='').length;
  v.innerHTML=`<section class="card">
   <div class="qhead"><div><div class="eyebrow">Phase 4 · 測試挑戰</div><h2 style="margin:0">第 ${T.i+1} / 5 題：${q.title}</h2></div><span class="timer ${T.left<=120?'low':''}" id="tm" aria-live="off">${mmss(T.left)}</span></div>
   <div class="bar"><i style="width:${answered/5*100}%;background:var(--orange)"></i></div>
   <div class="dots">${T.Q.map((_,k)=>`<button class="${k===T.i?'cur':''} ${T.ans[k]!==null&&T.ans[k]!==''?'done':''}" data-k="${k}" aria-label="第 ${k+1} 題">${k+1}</button>`).join('')}</div>
   <p style="font-size:1.05rem;margin-top:14px">${q.q}</p>
   ${q.type==='calc'?`<div class="ans"><input id="ta" inputmode="decimal" placeholder="輸入數值" aria-label="答案" value="${T.ans[T.i]??''}"><span class="u">${q.u}</span></div><p class="muted" style="font-size:.85rem">答案會自動儲存，可隨時切換題目修改。</p>`
    :`<div class="choices" id="tc">${q.o.map((o,k)=>`<button class="choice ${T.ans[T.i]===k?'sel':''}" data-k="${k}">${o}</button>`).join('')}</div>`}
   <div class="row" style="margin-top:10px">${T.i>0?'<button class="btn ghost" id="tp">上一題</button>':''}${T.i<4?'<button class="btn sec" id="tn">下一題</button>':''}
    <button class="btn" id="tsub" ${answered<5?'disabled':''}>交卷（${answered}/5）</button></div>
   <div id="tmsg"></div></section>`;
  if(q.type==='calc'){$('#ta').oninput=e=>{T.ans[T.i]=e.target.value.trim()===''?null:e.target.value.trim();refreshSub();};$('#ta').focus();}
  else $$('#tc .choice').forEach(b=>b.onclick=()=>{T.ans[T.i]=+b.dataset.k;$$('#tc .choice').forEach(x=>x.classList.toggle('sel',x===b));refreshSub();});
  $$('.dots button').forEach(b=>b.onclick=()=>{T.i=+b.dataset.k;p4(v);});
  $('#tp')&&($('#tp').onclick=()=>{T.i--;p4(v);});$('#tn')&&($('#tn').onclick=()=>{T.i++;p4(v);});
  $('#tsub').onclick=()=>{const bad=T.Q.findIndex((qq,k)=>qq.type==='calc'&&!isFinite(num(T.ans[k])));if(bad>=0){$('#tmsg').innerHTML=`<div class="fb bad">第 ${bad+1} 題不是有效數字，請修正後再交卷。</div>`;return;}submitTest();};
  function refreshSub(){const n=T.ans.filter(a=>a!==null&&a!=='').length;$('#tsub').disabled=n<5;$('#tsub').textContent=`交卷（${n}/5）`;
    $$('.dots button').forEach((b,k)=>b.classList.toggle('done',T.ans[k]!==null&&T.ans[k]!==''));$('.bar i').style.width=n/5*100+'%';progress();}
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=t=>String(Math.floor(Math.max(0,t)/60)).padStart(2,'0')+':'+String(Math.max(0,t)%60).padStart(2,'0');
function startTick(){if(tick)clearInterval(tick);tick=setInterval(()=>{const T=S.test;if(!T||T.submitted){clearInterval(tick);return;}
  T.left=900-Math.floor((Date.now()-T.startAt)/1000);const el=$('#tm');if(el){el.textContent=mmss(T.left);el.classList.toggle('low',T.left<=120);}
  if(T.left<=0){submitTest(true);}},1000);}
function submitTest(timeout){const T=S.test;if(T.submitted)return;clearInterval(tick);T.submitted=true;T.timeout=!!timeout;T.used=Math.min(900,900-Math.max(0,T.left));
  T.ok=T.Q.map((q,k)=>q.type==='calc'?near(num(T.ans[k]),q.ans):T.ans[k]===q.a);
  S.done.p4=true;S.reportAt=new Date();go('report');}

/* ============ 成績報告 ============ */
function report(v){
  const T=S.test;if(!T||!T.submitted){v.innerHTML='<section class="card"><p>尚未完成測試。</p></section>';return;}
  const pr=S.prac.pts.reduce((a,b)=>a+b,0),ts=T.ok.filter(Boolean).length*20,total=Math.round(pr*0.3+ts*0.7);
  const g=total>=90?'A':total>=80?'B':total>=70?'C':'D';
  const msg={A:'太出色了！你對應力的掌握已經可以協助吊橋安全檢查。下一站：剪應力與容許應力設計！',B:'表現很好！觀念紮實，再多留意單位換算與剪力面數目，就能拿到 A。',C:'基礎已經建立。回頭複習範例的 4 步 SOP，下一次一定更穩。',D:'別灰心，每位工程師都是從算錯開始的。重看 Phase 1 與 Phase 2，再挑戰一次！'}[g];
  const dt=S.reportAt,ds=`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
  const yours=(q,k)=>q.type==='calc'?(T.ans[k]==null?'（未作答）':esc(T.ans[k])+' '+q.u):(T.ans[k]==null?'（未作答）':q.o[T.ans[k]]);
  v.innerHTML=`<section class="card report" id="rep">
   <div class="eyebrow">成績報告 · Score Report</div>
   <h2>[MOM-CH1-G1] Stress · 應力探索：橋樑承受的力量</h2>
   <div class="meta"><div><small>姓名</small>${esc(S.stu.name)}</div><div><small>班級</small>${esc(S.stu.cls)}</div><div><small>學號</small>${esc(S.stu.id)}</div><div><small>日期時間</small><span class="num">${ds}</span></div><div><small>測試用時</small><span class="num">${mmss(T.used)}</span>${T.timeout?'（時間到自動交卷）':''}</div><div><small>題目種子</small><span class="num">#${T.seed}</span></div></div>
   <div class="gradebox"><div class="grade">${g}</div><div><div class="muted">總分（練習 30% + 測試 70%）</div><div class="tot">${total} / 100</div>
    <div class="muted">Phase 3 練習：<b>${pr}</b> / 100　·　Phase 4 測試：<b>${ts}</b> / 100</div></div></div>
   <h3>Phase 3 練習明細</h3>
   <div class="tbl"><table><thead><tr><th>題</th><th>題目</th><th>結果</th><th>得分</th></tr></thead><tbody>
    ${PQ.map((q,k)=>`<tr><td>${k+1}</td><td>${q.title}</td><td>${S.prac.res[k]===true?'✓ 正確':S.prac.res[k]===false?'✗ 未得分':'— 未作答'}</td><td class="num">${S.prac.pts[k]} / 25</td></tr>`).join('')}
   </tbody></table></div>
   <h3>Phase 4 測試明細</h3>
   <div class="tbl"><table><thead><tr><th>題</th><th>題目</th><th>你的答案</th><th>正確答案</th><th>對錯</th></tr></thead><tbody>
    ${T.Q.map((q,k)=>`<tr><td>${k+1}</td><td>${q.title}<div class="muted" style="font-size:.8rem">${q.sol}</div></td><td>${yours(q,k)}</td><td>${q.type==='calc'?q.disp:q.o[q.a]}</td><td>${T.ok[k]?'<span class="pill ok">✓ 對</span>':'<span class="pill bad">✗ 錯</span>'}</td></tr>`).join('')}
   </tbody></table></div>
   ${talk(msg,g==='D'?'think':'wow',70)}
   <p class="muted" style="font-size:.8rem">等第標準：A ≥ 90、B ≥ 80、C ≥ 70、D < 70。數值題以 ±2% 為正確。</p>
  </section>
  <section class="card noprint"><div class="row">
   <button class="btn" id="bprint">列印 / 存成 PDF</button><button class="btn sec" id="bcopy">複製成績文字</button><span class="muted" id="cmsg"></span></div>
   <p class="muted" style="font-size:.85rem;margin-bottom:0">若列印視窗沒有出現，請使用「複製成績文字」貼到作業系統，或直接截圖此頁上方的報告交給老師。</p></section>`;
  $('#bprint').onclick=()=>{try{window.print();}catch(e){}};
  $('#bcopy').onclick=()=>{const txt=[`[MOM-CH1-G1] Stress - 應力探索：橋樑承受的力量`,`姓名：${S.stu.name}　班級：${S.stu.cls}　學號：${S.stu.id}`,`日期：${ds}　種子：#${T.seed}`,`練習得分：${pr}/100　測試得分：${ts}/100`,`總分：${total}　等第：${g}`,
      ...T.Q.map((q,k)=>`測試${k+1} ${q.title}：${T.ok[k]?'對':'錯'}（你的答案 ${yours(q,k).replace(/<[^>]+>/g,'')}；正解 ${(q.type==='calc'?q.disp:q.o[q.a]).replace(/<[^>]+>/g,'')}）`)].join('\n');
    const done=()=>$('#cmsg').textContent='已複製，可貼到作業系統。';
    try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt));}catch(e){fallback(txt);}
    function fallback(t){const ta=document.createElement('textarea');ta.value=t;ta.style.width='100%';ta.rows=8;$('#cmsg').textContent='請手動全選並複製下方文字：';$('#bcopy').closest('.card').appendChild(ta);ta.select();}};
  reward({target:$('.grade')},0);
}

render();
</script>
